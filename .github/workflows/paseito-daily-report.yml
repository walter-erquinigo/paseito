name: Paseito daily email report

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: Send now without the New York 07:00 gate
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: paseito-daily-email
  cancel-in-progress: false

jobs:
  report:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_TOKEN_CACHE_KEY: ${{ secrets.GRAPH_TOKEN_CACHE_KEY }}
      REPORT_FAILURE_TITLE: Paseito daily email delivery is blocked
    steps:
      - uses: actions/checkout@v7
        with:
          ref: paseito

      - name: Enforce 07:00 New York gate
        id: gate
        shell: bash
        run: |
          args=(--gate-only)
          if [[ "${{ inputs.force_send || 'false' }}" == true ]]; then args+=(--force); fi
          python3 automation/reporting/daily_report.py "${args[@]}"

      - name: Download latest encrypted cache and status state
        if: steps.gate.outputs.should_send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/reporting/download_latest_artifact.py graph-token-cache --output cache || test $? -eq 2
          python3 automation/reporting/download_latest_artifact.py paseito-report-state --output report-state || test $? -eq 2
          python3 automation/reporting/download_latest_artifact.py paseito-local-status --output local-status || test $? -eq 2
          if [[ ! -f cache/graph-token-cache.enc ]]; then
            test -n "${{ secrets.GRAPH_TOKEN_CACHE_SEED }}"
            mkdir -p cache
            printf '%s' "${{ secrets.GRAPH_TOKEN_CACHE_SEED }}" | base64 --decode > cache/graph-token-cache.enc
            chmod 600 cache/graph-token-cache.enc
          fi

      - name: Send idempotent daily report
        if: steps.gate.outputs.should_send == 'true'
        shell: bash
        run: |
          args=(
            --cache cache/graph-token-cache.enc
            --state report-state/report-state.json
            --status local-status/status.json
            --output-state report-state.json
          )
          if [[ "${{ inputs.force_send || 'false' }}" == true ]]; then args+=(--force); fi
          python3 automation/reporting/daily_report.py "${args[@]}"

      - name: Retain rotated encrypted token cache
        if: always() && steps.gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: graph-token-cache
          path: cache/graph-token-cache.enc
          if-no-files-found: error
          retention-days: 90

      - name: Retain New York date idempotency key
        if: success() && steps.gate.outputs.should_send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: paseito-report-state
          path: report-state.json
          if-no-files-found: error
          retention-days: 90

      - name: Mark reporting healthy
        if: success() && steps.gate.outputs.should_send == 'true'
        shell: bash
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$REPORT_FAILURE_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Email delivery recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Persist visible email transport failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$REPORT_FAILURE_TITLE in:title" --json number --jq '.[0].number // empty')"
          body="Microsoft Graph email delivery failed visibly. No success email can report this transport failure. Run: $run_url"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$REPORT_FAILURE_TITLE" --body "$body"
          fi
