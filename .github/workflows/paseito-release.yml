name: Paseito fail-closed release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      additional_release:
        description: Publish another Paseito revision for the current upstream release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: paseito-upstream-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FAILURE_TITLE: "Paseito automated release is blocked"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: paseito

      - name: Confirm free public runner and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.visibility }}" = public
          test "$(uname -m)" = arm64

      - name: Discover stable upstream release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          force=false
          if [[ "${{ inputs.additional_release || 'false' }}" == true ]]; then force=true; fi
          if [[ "$force" == true ]]; then
            python3 automation/release/check_upstream.py --force
          else
            python3 automation/release/check_upstream.py
          fi

      - name: Stop when nothing changed
        if: steps.release.outputs.needs_release != 'true'
        run: echo "No unpublished stable upstream release was found."

      - name: Prepare rebased candidate
        if: steps.release.outputs.needs_release == 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          original_sha="$(git rev-parse HEAD)"
          git remote add upstream-release https://github.com/getpaseo/paseo.git
          git fetch --tags upstream-release
          test "$(git rev-parse '${{ steps.release.outputs.upstream_tag }}^{}')" = "${{ steps.release.outputs.upstream_commit }}"
          git switch -c paseito-release-candidate
          if [[ "${{ steps.release.outputs.old_upstream_commit }}" != "${{ steps.release.outputs.upstream_commit }}" ]]; then
            git rebase --onto "${{ steps.release.outputs.upstream_commit }}" \
              "${{ steps.release.outputs.old_upstream_commit }}" paseito-release-candidate
          fi
          python3 automation/release/set_version.py \
            "${{ steps.release.outputs.paseito_version }}" \
            --upstream-tag "${{ steps.release.outputs.upstream_tag }}" \
            --upstream-commit "${{ steps.release.outputs.upstream_commit }}"
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json packages/desktop/package.json automation/upstream.json
            git commit -m "chore: prepare ${{ steps.release.outputs.paseito_version }}"
          fi
          echo "original_sha=$original_sha" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.release.outputs.needs_release == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.needs_release == 'true'
        run: node scripts/npm-retry.mjs ci

      - name: Verify formatting and lint
        if: steps.release.outputs.needs_release == 'true'
        run: |
          npm run format:check
          npm run lint

      - name: Build dependencies and typecheck
        if: steps.release.outputs.needs_release == 'true'
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio
          npm run typecheck

      - name: Run Paseito and relevant upstream tests
        if: steps.release.outputs.needs_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for suite in automation/release automation/installer automation/launchagents automation/migration automation/reporting; do
            python3 -m unittest discover -s "$suite" -p 'test_*.py'
          done
          npx vitest run \
            packages/protocol/src/messages.checkout-commits.test.ts \
            packages/protocol/src/agent-deep-link.test.ts \
            packages/server/src/utils/checkout-git.commits.test.ts \
            packages/server/src/utils/checkout-git.test.ts \
            packages/app/src/git/changes-base-selection.test.ts \
            packages/app/src/git/query-keys.test.ts \
            packages/app/src/diagnostics/app-diagnostic-report.test.ts \
            packages/desktop/src/agent-navigation.test.ts \
            packages/cli/src/cli-surface.test.ts \
            packages/cli/src/commands/hub/device-authorization.test.ts

      - name: Package and smoke test unsigned arm64 app
        if: steps.release.outputs.needs_release == 'true'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never --mac --arm64

      - name: Verify artifact architecture and write provenance
        if: steps.release.outputs.needs_release == 'true'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find packages/desktop/release -maxdepth 1 -type f -name 'Paseito-*-arm64.zip' -print -quit)"
          test -n "$artifact"
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          ditto -x -k "$artifact" "$inspect_dir"
          executable="$inspect_dir/Paseito.app/Contents/MacOS/Paseito"
          test -f "$executable"
          test "$(lipo -archs "$executable")" = arm64
          python3 automation/release/write_provenance.py \
            --artifact "$artifact" \
            --upstream-tag "${{ steps.release.outputs.upstream_tag }}" \
            --upstream-commit "${{ steps.release.outputs.upstream_commit }}" \
            --paseito-commit "${{ steps.candidate.outputs.commit }}" \
            --version "${{ steps.release.outputs.paseito_version }}" \
            --release-tag "${{ steps.release.outputs.release_tag }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "checksum=$artifact.sha256" >> "$GITHUB_OUTPUT"

      - name: Atomically advance verified branch and tag
        if: steps.release.outputs.needs_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.release_tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{}")" = "${{ steps.candidate.outputs.commit }}"
            test "$(git rev-parse origin/paseito)" = "${{ steps.candidate.outputs.commit }}"
            echo "Recovering publication for the already-verified branch and tag."
          else
            git tag -a "$tag" "${{ steps.candidate.outputs.commit }}" -m "Paseito ${{ steps.release.outputs.paseito_version }}"
            git push --atomic \
              --force-with-lease="refs/heads/paseito:${{ steps.candidate.outputs.original_sha }}" \
              origin \
              "${{ steps.candidate.outputs.commit }}:refs/heads/paseito" \
              "refs/tags/$tag:refs/tags/$tag"
          fi

      - name: Publish verified release assets
        if: steps.release.outputs.needs_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.release_tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifact.outputs.path }}" \
              "${{ steps.artifact.outputs.checksum }}" \
              provenance.json \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              "${{ steps.artifact.outputs.path }}" \
              "${{ steps.artifact.outputs.checksum }}" \
              provenance.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Paseito ${{ steps.release.outputs.paseito_version }}" \
              --notes "Unsigned Apple Silicon build based on getpaseo/paseo ${{ steps.release.outputs.upstream_tag }}. Verify provenance.json and the SHA-256 checksum before installation."
          fi

      - name: Close resolved failure issue
        if: success() && steps.release.outputs.needs_release == 'true'
        shell: bash
        run: |
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$FAILURE_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Resolved by workflow run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Retain small failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paseito-release-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 3

      - name: Open or update deduplicated failure issue
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$FAILURE_TITLE in:title" --json number --jq '.[0].number // empty')"
          body="Fail-closed automation stopped without publishing an installable release. Diagnostics: $run_url"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$FAILURE_TITLE" --body "$body"
          fi
