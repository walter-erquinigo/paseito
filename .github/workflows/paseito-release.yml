name: Paseito deterministic candidate verification
run-name: Verify ${{ inputs.candidate_ref }} @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch prepared by the local Codex controller
        required: true
        type: string
      expected_sha:
        description: Exact candidate commit to verify
        required: true
        type: string
      upstream_tag:
        description: Exact stable upstream tag
        required: true
        type: string
      upstream_commit:
        description: Peeled upstream commit
        required: true
        type: string
      paseito_version:
        description: Paseito version in the candidate
        required: true
        type: string
      release_tag:
        description: Future release tag, created locally after verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paseito-upstream-release
  cancel-in-progress: false

jobs:
  verify-macos:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Verify immutable candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(jq -r .upstreamTag automation/upstream.json)" = "${{ inputs.upstream_tag }}"
          test "$(jq -r .upstreamCommit automation/upstream.json)" = "${{ inputs.upstream_commit }}"
          test "$(jq -r .paseitoVersion automation/upstream.json)" = "${{ inputs.paseito_version }}"
          test "$(jq -r .version package.json)" = "${{ inputs.paseito_version }}"
          test -f "automation/decisions/${{ inputs.paseito_version }}.json"
          git remote add upstream-verify https://github.com/getpaseo/paseo.git
          git fetch --no-tags upstream-verify "refs/tags/${{ inputs.upstream_tag }}:refs/tags/paseito-verified-upstream"
          test "$(git rev-parse 'refs/tags/paseito-verified-upstream^{}')" = "${{ inputs.upstream_commit }}"
          git merge-base --is-ancestor "${{ inputs.upstream_commit }}" HEAD

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Build dependencies and typecheck
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio
          npm run typecheck

      - name: Run semantic-sync and relevant upstream tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in automation/release automation/installer automation/launchagents automation/migration automation/reporting automation/remote; do
            python3 -m unittest discover -s "$suite" -p 'test_*.py'
          done
          npx vitest run \
            packages/protocol/src/messages.checkout-commits.test.ts \
            packages/protocol/src/agent-deep-link.test.ts \
            packages/server/src/utils/checkout-git.commits.test.ts \
            packages/server/src/utils/checkout-git.test.ts \
            packages/app/src/git/changes-base-selection.test.ts \
            packages/app/src/git/query-keys.test.ts \
            packages/app/src/diagnostics/app-diagnostic-report.test.ts \
            packages/desktop/src/agent-navigation.test.ts \
            packages/cli/src/cli-surface.test.ts

      - name: Package and smoke test unsigned arm64 app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never --mac --arm64

      - name: Verify macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find packages/desktop/release -maxdepth 1 -type f -name 'Paseito-*-arm64.zip' -print -quit)"
          test -n "$artifact"
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          ditto -x -k "$artifact" "$inspect_dir"
          executable="$inspect_dir/Paseito.app/Contents/MacOS/Paseito"
          test -f "$executable"
          test "$(lipo -archs "$executable")" = arm64
          mkdir candidate-macos
          cp "$artifact" candidate-macos/

      - uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate-macos
          path: candidate-macos
          if-no-files-found: error
          retention-days: 3

      - name: Retain packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 3

  verify-linux-daemon:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Verify immutable candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(jq -r .upstreamTag automation/upstream.json)" = "${{ inputs.upstream_tag }}"
          test "$(jq -r .upstreamCommit automation/upstream.json)" = "${{ inputs.upstream_commit }}"
          test "$(jq -r .paseitoVersion automation/upstream.json)" = "${{ inputs.paseito_version }}"
          test "$(jq -r .version package.json)" = "${{ inputs.paseito_version }}"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install and build daemon packages
        run: |
          node scripts/npm-retry.mjs ci
          npm run build:server

      - name: Package and smoke test Linux x64 daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate-linux extracted
          artifact="candidate-linux/Paseito-daemon-${{ inputs.paseito_version }}-linux-x64.tar.gz"
          python3 automation/release/package_linux_daemon.py \
            --version "${{ inputs.paseito_version }}" \
            --commit "${{ inputs.expected_sha }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --output "$artifact"
          tar -xzf "$artifact" -C extracted
          manifest=extracted/paseito-daemon/manifest.json
          test "$(jq -r .schemaVersion "$manifest")" = 3
          test "$(jq -r .version "$manifest")" = "${{ inputs.paseito_version }}"
          test "$(jq -r .daemonVersion "$manifest")" = "$(jq -r .version packages/server/package.json)"
          test "$(jq -r .commit "$manifest")" = "${{ inputs.expected_sha }}"
          test "$(jq -r .source.repository "$manifest")" = "walter-erquinigo/paseito"
          test "$(jq -r .source.releaseTag "$manifest")" = "${{ inputs.release_tag }}"
          integrity="extracted/paseito-daemon/$(jq -r .runtimeIntegrity.path "$manifest")"
          test "$(sha256sum "$integrity" | awk '{print $1}')" = "$(jq -r .runtimeIntegrity.sha256 "$manifest")"
          python3 - <<'PY'
          import json
          from pathlib import Path
          from automation.release.package_linux_daemon import runtime_integrity

          root = Path("extracted/paseito-daemon")
          expected = json.loads((root / "runtime-integrity.json").read_text(encoding="utf-8"))
          if runtime_integrity(root) != expected:
              raise SystemExit("packaged daemon runtime inventory does not match its extracted tree")
          PY
          test "$(jq -r .feature "$manifest")" = changesBaseSelector
          test "$(jq -r '.features | contains(["workspaceLsp"])' "$manifest")" = true
          entrypoint="$(jq -r .entrypoint "$manifest")"
          test -x "extracted/paseito-daemon/$entrypoint"
          node "extracted/paseito-daemon/$entrypoint" --version

      - uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate-linux
          path: candidate-linux
          if-no-files-found: error
          retention-days: 3

  assemble-provenance:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    needs: [verify-macos, verify-linux-daemon]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: paseito-candidate-macos
          path: candidate-artifact

      - uses: actions/download-artifact@v8
        with:
          name: paseito-candidate-linux
          path: candidate-artifact

      - name: Bind both artifacts to candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          mac_artifact="$(find candidate-artifact -maxdepth 1 -type f -name 'Paseito-*-arm64.zip' -print -quit)"
          linux_artifact="$(find candidate-artifact -maxdepth 1 -type f -name 'Paseito-daemon-*-linux-x64.tar.gz' -print -quit)"
          test -n "$mac_artifact"
          test -n "$linux_artifact"
          python3 automation/release/write_provenance.py \
            --artifact "$mac_artifact" \
            --linux-artifact "$linux_artifact" \
            --upstream-tag "${{ inputs.upstream_tag }}" \
            --upstream-commit "${{ inputs.upstream_commit }}" \
            --paseito-commit "${{ inputs.expected_sha }}" \
            --version "${{ inputs.paseito_version }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --decision "automation/decisions/${{ inputs.paseito_version }}.json" \
            --output candidate-artifact/provenance.json

      - uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate
          path: candidate-artifact
          if-no-files-found: error
          retention-days: 3
