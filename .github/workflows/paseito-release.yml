name: Paseito deterministic candidate verification
run-name: Verify ${{ inputs.candidate_ref }} @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch prepared by the local Codex controller
        required: true
        type: string
      expected_sha:
        description: Exact candidate commit to verify
        required: true
        type: string
      upstream_tag:
        description: Exact stable upstream tag
        required: true
        type: string
      upstream_commit:
        description: Peeled upstream commit
        required: true
        type: string
      paseito_version:
        description: Paseito version in the candidate
        required: true
        type: string
      release_tag:
        description: Future release tag, created locally after verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paseito-upstream-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false && github.repository == 'walter-erquinigo/paseito'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Verify immutable candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(jq -r .upstreamTag automation/upstream.json)" = "${{ inputs.upstream_tag }}"
          test "$(jq -r .upstreamCommit automation/upstream.json)" = "${{ inputs.upstream_commit }}"
          test "$(jq -r .paseitoVersion automation/upstream.json)" = "${{ inputs.paseito_version }}"
          test "$(jq -r .version package.json)" = "${{ inputs.paseito_version }}"
          test -f "automation/decisions/${{ inputs.paseito_version }}.json"
          git remote add upstream-verify https://github.com/getpaseo/paseo.git
          git fetch --no-tags upstream-verify "refs/tags/${{ inputs.upstream_tag }}:refs/tags/paseito-verified-upstream"
          test "$(git rev-parse 'refs/tags/paseito-verified-upstream^{}')" = "${{ inputs.upstream_commit }}"
          git merge-base --is-ancestor "${{ inputs.upstream_commit }}" HEAD

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Build dependencies and typecheck
        run: |
          npm run build:server
          npm run build --workspace=@getpaseo/expo-two-way-audio
          npm run typecheck

      - name: Run semantic-sync and relevant upstream tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in automation/release automation/installer automation/launchagents automation/migration automation/reporting; do
            python3 -m unittest discover -s "$suite" -p 'test_*.py'
          done
          npx vitest run \
            packages/protocol/src/messages.checkout-commits.test.ts \
            packages/protocol/src/agent-deep-link.test.ts \
            packages/server/src/utils/checkout-git.commits.test.ts \
            packages/server/src/utils/checkout-git.test.ts \
            packages/app/src/git/changes-base-selection.test.ts \
            packages/app/src/git/query-keys.test.ts \
            packages/app/src/diagnostics/app-diagnostic-report.test.ts \
            packages/desktop/src/agent-navigation.test.ts \
            packages/cli/src/cli-surface.test.ts \
            packages/cli/src/commands/hub/device-authorization.test.ts

      - name: Package and smoke test unsigned arm64 app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: "true"
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: npm run build:desktop -- --publish never --mac --arm64

      - name: Verify artifact and write provenance
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find packages/desktop/release -maxdepth 1 -type f -name 'Paseito-*-arm64.zip' -print -quit)"
          test -n "$artifact"
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          ditto -x -k "$artifact" "$inspect_dir"
          executable="$inspect_dir/Paseito.app/Contents/MacOS/Paseito"
          test -f "$executable"
          test "$(lipo -archs "$executable")" = arm64
          python3 automation/release/write_provenance.py \
            --artifact "$artifact" \
            --upstream-tag "${{ inputs.upstream_tag }}" \
            --upstream-commit "${{ inputs.upstream_commit }}" \
            --paseito-commit "${{ inputs.expected_sha }}" \
            --version "${{ inputs.paseito_version }}" \
            --release-tag "${{ inputs.release_tag }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --decision "automation/decisions/${{ inputs.paseito_version }}.json"
          mkdir candidate-artifact
          cp "$artifact" "$artifact.sha256" provenance.json candidate-artifact/

      - uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate
          path: candidate-artifact
          if-no-files-found: error
          retention-days: 3

      - name: Retain packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paseito-candidate-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 3
